spring:
  application:
    name: continuum_control
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/continuum}
    username: ${DB_USER:continuum}
    password: ${DB_PASSWORD:continuum}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8081}
