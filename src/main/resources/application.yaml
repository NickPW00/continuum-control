spring:
  application:
    name: continuum_control
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/continuum}
    username: ${DB_USER:continuum}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validade
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    flyway:
      locations: classpath:db/migration
