# Ambiente completo do Continuum Control (§26, doc 04 seção 8): os três bancos e a aplicação.
# Os valores padrão servem para desenvolvimento e avaliação; para outro ambiente, copie
# .env.example para .env e troque as senhas.
#
#   docker compose up -d --build             tudo, inclusive a aplicação (porta 8080)
#   docker compose up -d postgres mongo redis   só os bancos, para rodar a aplicação na IDE
#   docker compose down -v                    para e apaga os dados (recomeça do zero)

services:
  postgres:
    image: postgres:16
    container_name: continuum-postgres
    environment:
      POSTGRES_DB: continuum
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-continuum}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-continuum}
      DB_MIGRACAO_USER: ${DB_MIGRACAO_USER:-continuum_migracao}
      DB_MIGRACAO_PASSWORD: ${DB_MIGRACAO_PASSWORD:-continuum_migracao}
      DB_APP_USER: ${DB_APP_USER:-continuum_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-continuum_app}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d continuum"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: continuum-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-continuum_root}
      MONGO_INITDB_DATABASE: continuum
      MONGO_APP_USER: ${MONGO_APP_USER:-continuum_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-continuum_app}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: continuum-redis
    # Cache: sem persistência em disco, com limite de memória e descarte das chaves menos usadas (doc 04, 5.3)
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru",
              "--requirepass", "${REDIS_PASSWORD:-continuum_redis}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-continuum_redis}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: continuum-control:latest
    container_name: continuum-app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/continuum
      DB_APP_USER: ${DB_APP_USER:-continuum_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-continuum_app}
      DB_MIGRACAO_USER: ${DB_MIGRACAO_USER:-continuum_migracao}
      DB_MIGRACAO_PASSWORD: ${DB_MIGRACAO_PASSWORD:-continuum_migracao}
      MONGO_URI: mongodb://${MONGO_APP_USER:-continuum_app}:${MONGO_APP_PASSWORD:-continuum_app}@mongo:27017/continuum?authSource=continuum&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-continuum_redis}
      JWT_SECRET: ${JWT_SECRET:-segredo-de-desenvolvimento-do-continuum-control-troque-em-producao}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
